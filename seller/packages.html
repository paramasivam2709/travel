<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Packages</title>
  <meta name="description" content="Create, edit and manage your travel packages.">
  <meta name="keywords" content="stackly adventure dashboard">
  <link rel="icon" href="../img/logo.webp" type="image/webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/dashboard.css">
  <script>if(localStorage.getItem("theme")==="dark")document.documentElement.setAttribute("data-theme","dark");</script>
</head>
<body class="dash-body">
  <div class="dash-layout">
    <aside class="sidebar">
      <a href="../index.html" class="sb-brand">
        <img src="../img/logo.webp" alt="">
        <span><b>STACKLY</b></span>
      </a>
      <nav class="sb-nav">
        <a href="index.html"><span class="ic ic-home"></span>Dashboard</a>
        <a href="packages.html" class="active"><span class="ic ic-box"></span>Packages</a>
        <a href="bookings.html"><span class="ic ic-calendar"></span>Bookings</a>
        <a href="customers.html"><span class="ic ic-users"></span>Customers</a>
        <a href="earnings.html"><span class="ic ic-wallet"></span>Earnings</a>
        <a href="index.html#reviews"><span class="ic ic-star"></span>Reviews</a>
        <a href="index.html#messages"><span class="ic ic-message"></span>Messages</a>
        <a href="settings.html"><span class="ic ic-user"></span>Profile</a>
        <a href="settings.html"><span class="ic ic-settings"></span>Settings</a>
        <a href="logout.html"><span class="ic ic-logout"></span>Logout</a>
      </nav>
      <div class="sb-user">
        <span class="avatar js-user-initials" style="width:42px;height:42px;border-radius:50%;background:var(--grad-sun);color:#fff;display:grid;place-items:center;font-weight:800;font-family:var(--font-display)">--</span>
        <div><b class="js-user-name">Traveler</b><small class="js-user-role">User</small></div>
      </div>
    </aside>
    <main class="dash-main">
      <div class="dash-top">
        <div style="display:flex;align-items:center;gap:16px">
          <button class="sb-toggle" aria-label="Menu"><span class="ic ic-menu"></span></button>
          <div><h1>Packages</h1><p>Create, edit and manage your travel packages.</p></div>
        </div>
        <div class="dash-actions">
          <button class="dash-icon-btn theme-toggle" aria-label="Toggle theme"><span class="ic ic-moon"></span></button>
          <button class="dash-icon-btn" aria-label="Notifications"><span class="ic ic-bell"></span><span class="dot"></span></button>
          <a href="../index.html" class="btn btn-primary"><span class="ic ic-globe"></span>View Site</a>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>Package Manager</h2>
          <button class="btn btn-primary" id="addPkgBtn"><span class="ic ic-plus"></span>Add Package</button>
        </div>
        <div class="pkg-admin-grid" id="pkgAdminGrid"></div>
      </div>
    </main>
  </div>

  <div class="modal" id="pkgModal">
    <div class="modal-box">
      <button class="modal-close" aria-label="Close"><span class="ic ic-close"></span></button>
      <h2 id="pkgModalTitle">Add Package</h2>
      <form class="dash-form" id="pkgForm">
        <div class="full"><label>Package Title *</label><input class="form-control" name="title" required placeholder="e.g. Bali Island Escape"></div>
        <div><label>Destination *</label><input class="form-control" name="destination" required placeholder="Bali, Indonesia"></div>
        <div><label>Price (₹) *</label><input class="form-control" name="price" type="number" min="1" required placeholder="49999"></div>
        <div><label>Duration *</label><input class="form-control" name="duration" required placeholder="5 Days / 4 Nights"></div>
        <div><label>Image Path</label><input class="form-control" name="image" placeholder="../img/destinations/bali.webp"></div>
        <div class="full"><label>Description</label><textarea class="form-control" name="description" rows="3" placeholder="What makes this trip special?"></textarea></div>
        <div class="full"><button type="submit" class="btn btn-primary"><span class="ic ic-check"></span>Save Package</button></div>
      </form>
    </div>
  </div>
  <script src="../js/seller.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/dashboard.js"></script>
  <script>document.addEventListener("DOMContentLoaded",()=>dashBoot("seller"));</script>
</body>
</html>
