<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile</title>
  <meta name="description" content="Your traveler identity and preferences.">
  <meta name="keywords" content="stackly adventure dashboard">
  <link rel="icon" href="../img/logo.webp" type="image/webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/dashboard.css">
  <script>if(localStorage.getItem("theme")==="dark")document.documentElement.setAttribute("data-theme","dark");</script>
</head>
<body class="dash-body">
  <div class="dash-layout">
    <aside class="sidebar">
      <a href="../index.html" class="sb-brand">
        <img src="../img/logo.webp" alt="">
        <span><b>STACKLY</b></span>
      </a>
      <nav class="sb-nav">
        <a href="index.html"><span class="ic ic-home"></span>Dashboard</a>
        <a href="bookings.html"><span class="ic ic-calendar"></span>My Bookings</a>
        <a href="index.html#wishlist"><span class="ic ic-heart"></span>Wishlist</a>
        <a href="../index.html#destinations"><span class="ic ic-pin"></span>Destinations</a>
        <a href="index.html#messages"><span class="ic ic-message"></span>Messages</a>
        <a href="profile.html" class="active"><span class="ic ic-user"></span>Profile</a>
        <a href="settings.html"><span class="ic ic-settings"></span>Settings</a>
        <a href="logout.html"><span class="ic ic-logout"></span>Logout</a>
      </nav>
      <div class="sb-user">
        <span class="avatar js-user-initials" style="width:42px;height:42px;border-radius:50%;background:var(--grad-sun);color:#fff;display:grid;place-items:center;font-weight:800;font-family:var(--font-display)">--</span>
        <div><b class="js-user-name">Traveler</b><small class="js-user-role">User</small></div>
      </div>
    </aside>
    <main class="dash-main">
      <div class="dash-top">
        <div style="display:flex;align-items:center;gap:16px">
          <button class="sb-toggle" aria-label="Menu"><span class="ic ic-menu"></span></button>
          <div><h1>Profile</h1><p>Your traveler identity and preferences.</p></div>
        </div>
        <div class="dash-actions">
          <button class="dash-icon-btn theme-toggle" aria-label="Toggle theme"><span class="ic ic-moon"></span></button>
          <button class="dash-icon-btn" aria-label="Notifications"><span class="ic ic-bell"></span><span class="dot"></span></button>
          <a href="../index.html" class="btn btn-primary"><span class="ic ic-globe"></span>View Site</a>
        </div>
      </div>

      <div class="dash-cols" style="grid-template-columns:1fr 1.6fr">
        <div class="panel profile-card">
          <span class="avatar js-user-initials" style="width:96px;height:96px;border-radius:50%;background:var(--grad-sun);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.8rem;margin:0 auto 16px;border:4px solid var(--gold);font-family:var(--font-display)">--</span>
          <h3 class="js-user-name">Traveler</h3>
          <small class="js-user-email">you@example.com</small>
          <div class="p-stats">
            <div><b>24</b><small>Trips</small></div>
            <div><b>12</b><small>Wishlist</small></div>
            <div><b>4.9</b><small>Rating</small></div>
          </div>
          <span class="badge ok">Verified Explorer</span>
        </div>
        <div class="panel">
          <div class="panel-head"><h2>Edit Profile</h2></div>
          <form class="dash-form" id="profileForm">
            <div><label for="pName">Full Name</label><input class="form-control" id="pName" name="name" required></div>
            <div><label for="pEmail">Email</label><input class="form-control" id="pEmail" name="email" type="email" disabled></div>
            <div><label for="pPhone">Phone</label><input class="form-control" id="pPhone" name="phone"></div>
            <div><label for="pCity">City</label><input class="form-control" id="pCity" name="city" placeholder="Chennai"></div>
            <div class="full"><label for="pBio">Travel Bio</label><textarea class="form-control" id="pBio" name="bio" rows="4" placeholder="Mountains over beaches. Sunrises over sleep."></textarea></div>
            <div class="full"><button type="submit" class="btn btn-primary"><span class="ic ic-check"></span>Save Changes</button></div>
          </form>
        </div>
      </div>
    </main>
  </div>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/dashboard.js"></script>
  <script>document.addEventListener("DOMContentLoaded",()=>dashBoot("user"));</script>
</body>
</html>
